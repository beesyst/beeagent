[project]
name = "beeagent"
version = "0.32.0"
description = "BeeAgent pre-MVP skeleton"
readme = "README.ru.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8,<23",
    "langgraph==1.2.4",
    "pydantic==2.13.4",
    "beeagent-rop",
    "jinja2>=3.1.6",
    "fastapi>=0.136.3,<0.137",
    "uvicorn>=0.49.0,<0.50",
    "beeui>=0.13,<0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beeagent_module.web" = [
    "templates/*.html",
    "static/css/*.css",
    "static/vendor/tabler/*.css",
    "static/vendor/tabler/*.js",
    "static/vendor/tabler/LICENSE",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
beeagent-rop = { path = "../beeagent-rop", editable = true }
