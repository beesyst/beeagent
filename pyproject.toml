[project]
name = "beeagent"
version = "0.30.0"
description = "BeeAgent pre-MVP skeleton"
readme = "README.ru.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "langgraph==1.1.8",
    "beeagent-rop",
    "jinja2>=3.1.6",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beeagent_module.web" = [
    "templates/*.html",
    "static/css/*.css",
    "static/vendor/tabler/*.css",
    "static/vendor/tabler/*.js",
    "static/vendor/tabler/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
beeagent-rop = { path = "../beeagent-rop", editable = true }
