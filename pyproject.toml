[project]
name = "beeagent"
version = "0.57.1"
description = "BeeAgent pre-MVP skeleton"
readme = "README.ru.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "python-telegram-bot==22.8",
    "langgraph==1.2.11",
    "pydantic==2.13.4",
    "beeagent-rop==0.19.7",
    "jinja2==3.1.6",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "beeui==0.28.0",
]

[project.optional-dependencies]
docling-cpu = [
    "docling==2.122.0",
    "onnxruntime==1.29.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]
docling-cuda = [
    "docling==2.122.0",
    "onnxruntime==1.29.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[dependency-groups]
dev = [
    "httpx2==2.10.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beeagent_module.web" = [
    "templates/*.html",
    "static/css/*.css",
    "static/vendor/tabler/*.css",
    "static/vendor/tabler/*.js",
    "static/vendor/tabler/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:This field is deprecated\\. Use `generate_page_images=True`.*:DeprecationWarning:docling\\.pipeline\\.standard_pdf_pipeline",
    "ignore:deprecated:DeprecationWarning:docling\\.models\\.stages\\.ocr\\.rapid_ocr_model",
]

[tool.uv.sources]
beeagent-rop = { path = "../beeagent-rop", editable = true }
torch = [
    { index = "pytorch-cpu", extra = "docling-cpu" },
    { index = "pytorch-cu126", extra = "docling-cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "docling-cpu" },
    { index = "pytorch-cu126", extra = "docling-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "docling-cpu" },
        { extra = "docling-cuda" },
    ],
]
