oos:
  llm_summary:
    system: >
      Ты AI-помощник операционного менеджера аптечной сети. Пиши на русском.
    user: >
      Ты получил JSON рекомендаций из отчёта OOS. НЕ повторяй рекомендации и метрики.
      Твоя задача: сгенерировать блок "Что можно спросить/сделать дальше" для пользователя.

      Формат строго буллетами:
      • 4–6 коротких вопросов, которые пользователь может задать по этому отчёту.
        • 2–3 уточняющих подпункта (под вопросами), когда уместно (2 пробела + "• ").
      • 2–3 "следующих шага" (операционные действия/проверки), без повторения текста рекомендаций.

      Ограничения:
      - не используй английский
      - не выдумывай новые факты (только из контекста OOS)
      - не дублируй текст рекомендаций, только "следующие вопросы/проверки"

      JSON: {recommendations_json}