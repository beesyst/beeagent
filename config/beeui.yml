app:
  title:
    en: BeeAgent Console
    ru: Консоль BeeAgent
  product: beeagent
  logo_text:
    en: BeeAgent
    ru: BeeAgent
  locale:
    default: en
    available:
      - en
      - ru
  theme:
    mode: auto
    primary: blue
    base: gray
    font: sans-serif
    radius: 1
    density: default
  layout:
    type: vertical
    container: xl
    sidebar:
      variant: default
      collapsed: false
    navbar:
      enabled: false
      variant: default
      sticky: false

components:
  tabs:
    variant: fill
  accordion:
    variant: default

navigation:
  - title:
      en: Dashboard
      ru: Дашборд
    path: /
    icon: dashboard
  - title:
      en: ROP
      ru: РОП
    path: /rop
    icon: users
  - title:
      en: Runs
      ru: Запуски
    path: /runs
    icon: activity
  - title:
      en: Modules
      ru: Модули
    path: /modules
    icon: apps

data_sources: {}

blocks: {}

pages:
  - id: dashboard
    path: /
    title:
      en: BeeAgent Dashboard
      ru: Дашборд BeeAgent
    subtitle:
      en: Read-only operator dashboard
      ru: Read-only дашборд оператора
    blocks: []

  - id: rop_dashboard
    path: /rop
    title:
      en: ROP Dashboard
      ru: Панель РОПа
    subtitle:
      en: Inbound leads, review queue and Bitrix reconciliation
      ru: Входящие лиды, очередь проверки и сверка с Битрикс
    tabs:
      variant: fill_icons
      progressive: true
      surface: separated
      active_param: tab
      items:
        - id: overview
          title:
            en: Overview
            ru: Обзор
          href: /rop?tab=overview
          icon: dashboard

        - id: queue
          title:
            en: Queue
            ru: Очередь
          href: /rop?tab=queue
          icon: stack

        - id: sources
          title:
            en: Sources
            ru: Источники
          href: /rop?tab=sources
          icon: database

        - id: blacklist
          title:
            en: Blacklist
            ru: Чёрный список
          href: /rop?tab=blacklist
          icon: ban
    blocks: []

  - id: runs
    path: /runs
    title:
      en: Runs
      ru: Запуски
    subtitle:
      en: Run history
      ru: История запусков
    blocks: []

  - id: modules
    path: /modules
    title:
      en: Modules
      ru: Модули
    subtitle:
      en: Module diagnostics
      ru: Диагностика модулей
    blocks: []
