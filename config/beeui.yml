app:
  title:
    en: BeeAgent Console
    ru: Консоль BeeAgent
  product: beeagent
  logo_text:
    en: BeeAgent
    ru: BeeAgent
  locale:
    default: en
    available:
      - en
      - ru
  theme:
    mode: auto
    primary: blue
    base: gray
    font: sans-serif
    radius: 1
    density: default
  layout:
    type: vertical
    container: xl
    sidebar:
      variant: default
      collapsed: false
    navbar:
      enabled: false
      variant: default
      sticky: false

components:
  tabs:
    variant: fill
  accordion:
    variant: default

navigation:
  - title:
      en: Operator
      ru: Оператор
    children:
      - title:
          en: Dashboard
          ru: Дашборд
        path: /
        icon: dashboard
      - title:
          en: ROP
          ru: РОП
        path: /rop
        icon: users
      - title:
          en: Runs
          ru: Запуски
        path: /runs
        icon: runs
      - title:
          en: Modules
          ru: Модули
        path: /modules
        icon: modules

data_sources: {}

blocks: {}

pages:
  - id: dashboard
    path: /
    title:
      en: BeeAgent Dashboard
      ru: Дашборд BeeAgent
    subtitle:
      en: Read-only operator dashboard
      ru: Read-only дашборд оператора
    blocks: []

  - id: rop_dashboard
    path: /rop
    title:
      en: ROP Dashboard
      ru: Панель РОПа
    subtitle:
      en: Inbound leads, review queue and Bitrix reconciliation
      ru: Входящие лиды, очередь проверки и сверка с Битрикс
    tabs:
      variant: fill
      active_param: tab
      items:
        - id: overview
          title:
            en: Overview
            ru: Обзор
          href: /rop?tab=overview
        - id: queue
          title:
            en: Queue
            ru: Очередь
          href: /rop?tab=queue
        - id: threads
          title:
            en: Threads
            ru: Цепочки
          href: /rop?tab=threads
        - id: ai_assist
          title:
            en: AI Assist
            ru: AI ассистент
          href: /rop?tab=ai_assist
        - id: sources
          title:
            en: Sources
            ru: Источники
          href: /rop?tab=sources
        - id: attachments
          title:
            en: Attachments
            ru: Вложения
          href: /rop?tab=attachments
        - id: evidence
          title:
            en: Evidence
            ru: Доказательства
          href: /rop?tab=evidence
        - id: bitrix
          title:
            en: Bitrix
            ru: Битрикс
          href: /rop?tab=bitrix
        - id: recommendations
          title:
            en: Recommendations
            ru: Рекомендации
          href: /rop?tab=recommendations
    blocks: []

  - id: runs
    path: /runs
    title:
      en: Runs
      ru: Запуски
    subtitle:
      en: Run history
      ru: История запусков
    blocks: []

  - id: modules
    path: /modules
    title:
      en: Modules
      ru: Модули
    subtitle:
      en: Module diagnostics
      ru: Диагностика модулей
    blocks: []