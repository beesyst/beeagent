app:
  title: BeeAgent Console
  product: beeagent
  logo_text: BeeAgent
  locale:
    default: en
    available:
      - en
      - ru
  theme:
    mode: dark
    primary: blue
    base: gray
    font: sans-serif
    radius: 1
    density: default
  layout:
    type: vertical
    container: xl
    sidebar:
      variant: dark
      collapsed: false
    navbar:
      enabled: false
      variant: default
      sticky: false

components:
  tabs:
    variant: fill
  accordion:
    variant: default

navigation:
  - title: Operator
    children:
      - title: Dashboard
        path: /
        icon: dashboard
      - title: ROP
        path: /rop
        icon: users
      - title: Runs
        path: /runs
        icon: runs
      - title: Modules
        path: /modules
        icon: modules

data_sources: {}

blocks: {}

pages:
  - id: dashboard
    path: /
    title: BeeAgent Dashboard
    subtitle: Read-only operator dashboard
    blocks: []

  - id: rop_dashboard
    path: /rop
    title: ROP Dashboard
    subtitle: Inbound leads, review queue and Bitrix reconciliation
    tabs:
      variant: fill
      active_param: tab
      items:
        - id: overview
          title: Overview
          href: /rop?tab=overview
        - id: queue
          title: Queue
          href: /rop?tab=queue
        - id: threads
          title: Threads
          href: /rop?tab=threads
        - id: ai_assist
          title: AI Assist
          href: /rop?tab=ai_assist
        - id: sources
          title: Sources
          href: /rop?tab=sources
        - id: attachments
          title: Attachments
          href: /rop?tab=attachments
        - id: evidence
          title: Evidence
          href: /rop?tab=evidence
        - id: bitrix
          title: Bitrix
          href: /rop?tab=bitrix
    blocks: []

  - id: runs
    path: /runs
    title: Runs
    subtitle: Run history
    blocks: []

  - id: modules
    path: /modules
    title: Modules
    subtitle: Module diagnostics
    blocks: []
