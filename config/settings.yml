app:
  name: "BeeAgent"
  env: "dev"

run:
  mode: "telegram"

web:
  host: "127.0.0.1"
  port: 8000
  open_browser: true
  auth:
    enabled: true
    mode: beeui_session
    session_secret_env: BEEAGENT_WEB_SESSION_SECRET
    principals:
      - id: admin
        username: admin
        role: admin
        scopes: ["*"]
        token_env: BEEAGENT_WEB_ADMIN_TOKEN
      - id: rop
        username: rop
        role: operator
        scopes:
          [
            "rop",
            "rop.sources.write",
            "rop.blacklist.write",
            "rop.routing.write",
            "rop.users.write",
            "rop.settings.write",
            "rop.crm.write",
          ]
        token_env: BEEAGENT_WEB_ROP_TOKEN
      - id: operator
        username: operator
        role: operator
        scopes: ["dashboard", "rop", "rop.blacklist.write", "runs", "modules"]
        token_env: BEEAGENT_WEB_OPERATOR_TOKEN

telegram:
  enabled: false
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "CHAT_ID"
  telemetry_enabled: true

logging:
  clear_logs: true
  utc: true
  level: "INFO"

mock:
  seed: 42
  weeks: 4
  stores: 3
  skus: 12
  category: "Vitamins"

data:
  adapter: "mock"
  mock:
    dataset_id: null

scheduler:
  enabled: false
  interval: 100
  start_run: true

approval:
  reject_reason: "Rejected by operator"

promo:
  stock_min: 10
  units_max: 2

i18n:
  lang: "ru"
  path: "config/i18n/ru.yml"

quiz:
  enabled: false
  path: "config/quiz/pharmacy_quiz.json"

modules:
  registry:
    - id: "beeagent-rop"
      package: "beeagent_rop"
      entry: "RopModule"
      enabled: false
      install_extra: "rop"

    - id: "beedrill"
      package: "beedrill.module"
      entry: "BeeDrillModule"
      enabled: false
      install_extra: "beedrill"

    - id: "beescan"
      package: "beescan.module"
      entry: "BeeScanModule"
      enabled: true
      install_extra: "beescan"

beescan:
  probe_enabled: false
  approval: null
  detection_enabled: false
  detection_approval: null
  git_exposure_enabled: false
  git_exposure_approval: null
  investigation:
    enabled: false
    trusted_local_enabled: true
    local_lab_enabled: false
    approval: null
    ai_profile: openrouter
    task_bytes_max: 8192
    task_chars_max: 2000
    timeout_seconds: 20
    input_chars_max: 8000
    output_chars_max: 2000
    body_bytes_max: 73728
    adaptive:
      enabled: true
      max_steps: 2
      max_requests: 6

beedrill:
  ai_assist:
    enabled: false
    timeout: 20
    input_chars_max: 6000
    output_chars_max: 4000
    prompt_key: "beedrill.result_explanation"

rop:
  mailbox_poll:
    enabled: true
    source_id: "hotline_mailbox"
    sources_all: true
  sources_path: "config/rop/sources.yml"
  email_preview:
    body_chars_max: 4000
  ai_assist:
    enabled: true
    events_max: 100
    request_timeout: 30
    ai_confidence_min: 0.70
    dry_run: false
    adjudicator:
      enabled: true
      timeout: 20
      input_chars_max: 8000
      confidence_accept_min: 0.70
      events_max: 100
      attachment_chars_max: 2000
      prompt_key: "rop.ai_adjudicator"
  attachments:
    enabled: true
    chars_max: 1000
    size_max: 1048576
    types:
      - "text/plain"
      - "text/csv"
      - "application/pdf"
      - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      - "image/jpeg"
      - "image/png"
    storage:
      enabled: true
      file_max: 10485760
      message_max: 20971520
      files_message_max: 20
    extraction:
      engine: "docling"
      chars_max: 3000
      pages_max: 20
      timeout_seconds: 60
      ocr_enabled: true
  dashboard:
    default_period: "7d"
    periods:
      - today
      - yesterday
      - 7d
      - 30d
      - 90d
      - 365d
      - all
    leaderboard:
      plan_lead: 20

bitrix:
  enabled: true
  webhook_env: "BITRIX_WEBHOOK_URL"
  timeout: 10
  page_size: 50
  pages_max: 15
  types_entity:
    - 1
    - 2
    - 3
    - 4
  reconciliation:
    enabled: true
    candidate_limit: 20
    window_date: 180
    correlation:
      enabled: true
      window_days: 180
  writeback:
    enabled: true
    webhook_env: "BITRIX_WRITEBACK_WEBHOOK_URL"
    timeout: 10
    attempts_retry_max: 3
    dry_run: false
    email_attach: true
    email_completed: false
    file_attach: true
    source_id: "EMAIL"
    user_id_fallback: 167
    user_name_fallback: "ROBOT WG"
    stages:
      new_lead: "NEW"
      new_lead_assigned: "2"
      irrelevant: "JUNK"
  widget:
    enabled: false
    token_env: BITRIX_ROP_WIDGET_TOKEN
    default_period: "7d"
    max_items: 50
  blacklist_trigger:
    enabled: true
    secret_env: BITRIX_ROP_BLACKLIST_TRIGGER_SECRET
    event_app_token_env: BITRIX_ROP_EVENT_APP_TOKEN
    stage_id: "UC_T8EGR7"
    classification_field: ufCrm_1790592597
  embedded_app:
    enabled: true
    portal_origin: "https://my.welding.kz"
    default_role: "viewer"
    request_timeout: 10

ai:
  default_profile: openrouter
  prompts:
    path: "config/prompts.yml"
    store: false
  profiles:
    openai:
      provider: openai_responses
      api_key_env: OPENAI_API_KEY
      base_url: "https://api.openai.com/v1"
      model: "gpt-5.4-nano"
    deepseek:
      provider: openai_compatible
      api_key_env: DEEPSEEK_API_KEY
      base_url: "https://api.deepseek.com/v1"
      model: "deepseek-chat"
    lmstudio:
      provider: openai_compatible
      api_key_env: LMSTUDIO_API_KEY
      base_url: "http://127.0.0.1:1234/v1"
      model: "local-model"
    openrouter:
      provider: openai_compatible
      api_key_env: OPENROUTER_API_KEY
      base_url: "https://openrouter.ai/api/v1"
      model: "deepseek/deepseek-v4.1-flash"
    custom:
      provider: openai_compatible
      api_key_env: CUSTOM_AI_API_KEY
      base_url: ""
      model: ""
