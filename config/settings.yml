app:
  name: "BeeAgent" # название приложения
  env: "dev" # окружение (dev/prod)

run:
  mode: "telegram" # режим запуска UI/transport

web:
  host: "127.0.0.1" # bind host for read-only operator web shell
  port: 8000 # bind port for read-only operator web shell
  open_browser: false # true/false - auto-open browser in web mode

telegram:
  enabled: false # true/false - включить/выключить интеграцию с Telegram
  bot_token_env: "TELEGRAM_BOT_TOKEN" # название переменной окружения, в которой хранится токен бота
  chat_id_env: "CHAT_ID" # название переменной окружения, в которой хранится ID чата для отправки сообщений
  telemetry_enabled: true # true/false - включить/выключить запись телеметрии апдейтов в storage/telemetry (jsonl)

logging:
  clear_logs: true # true/false - очищать ли логи при каждом запуске приложения
  utc: true # true/false - использовать ли UTC для отметок времени в логах
  level: "INFO" # уровень логирования (DEBUG/INFO/WARNING/ERROR/CRITICAL)

mock:
  seed: 42 # начальное значение для генератора случайных чисел (целое число)
  weeks: 4 # количество недель для генерации данных (целое число)
  stores: 3 # количество магазинов для генерации данных (целое число)
  skus: 12 # количество товаров для генерации данных (целое число)
  category: "Vitamins" # категория товаров для генерации данных (строка)

data:
  adapter: "mock" # адаптер для получения данных (mock/real)
  mock:
    dataset_id: null # идентификатор набора данных для генерации (строка или null)

scheduler:
  enabled: false # true/false
  interval: 100 # интервал в секундах между запусками scheduled-run (сек)
  start_run: true # true/false - запускать scheduled-run при старте приложения

approval:
  reject_reason: "Rejected by operator" # причина отклонения заявки

promo:
  stock_min: 10 # минимальный остаток для promo-кандидатов
  units_max: 2 # максимальные продажи за период

recommendations:
  enabled: true # true/false - включить/выключить рекомендации для OOS
  items_max: 10 # максимальное число рекомендаций в отчете

llm:
  enabled: true # true/false - включить/выключить LLM summary
  provider: "openai" # провайдер LLM (пока один)
  model: "gpt-5-nano" # модель LLM (пример)
  api_key_env: "OPENAI_API_KEY" # имя переменной окружения с ключом
  api_url: "https://api.openai.com/v1/responses" # URL endpoint для LLM API
  prompts_path: "config/prompts.yml" # путь к YAML с промптами
  assistant:
    prompts_key: "oos.llm_assistant_qa" # ключ prompt в config/prompts.yml
    items_max: 5 # максимум рекомендаций, которые передаются в Q&A контекст
  throttling:
    timeout: 60 # timeout LLM request in seconds
    retries: 2 # retries on TimeoutError

i18n:
  lang: "ru" # язык локализации
  path: "config/i18n/ru.yml" # путь к YAML с переводами

quiz:
  enabled: false # true/false - включить/выключить режим квиза
  path: "config/quiz/pharmacy_quiz.json" # путь к JSON с контентом квиза (относительно корня проекта)

modules:
  registry: # список объявленных локальных модулей
    - id: "beeagent-rop" # уникальный идентификатор модуля внутри registry
      package: "beeagent_rop" # Python import name пакета
      entry: "RopModule" # имя атрибута в __init__ пакета (класс или фабрика)
      enabled: true # true/false - включить/выключить загрузку модуля

rop:
  sources: # список объявленных источников входных данных для ROP flow
    - source_id: "rop_batch_sample" # уникальный идентификатор источника
      source_type: "json_batch" # тип источника (поддерживается: json_batch)
      enabled: false # true/false - использовать этот источник
      authority: "read_only" # уровень доступа (read_only/draft_only/execution_capable)
      items_max: 100 # максимальное число событий из источника
      batch:
        path: "storage/mock/rop_batch_sample.json" # путь к batch-файлу (относительно корня проекта)
        period: "2026-05" # период, который передаётся в rop_summary payload
    - source_id: "hotline_mailbox" # read-only mailbox source для live smoke
      source_type: "mailbox_readonly" # тип источника для чтения последних писем из mailbox
      enabled: true # true/false - использовать этот источник
      authority: "read_only" # mailbox smoke не должен выполнять destructive actions
      items_max: 20 # максимальное число писем для одного smoke-run
      mailbox:
        host: "web01.srv.welding.kz" # IMAP host без секретов
        port: 993 # IMAP port
        use_ssl: true # использовать IMAP over SSL
        folder: "welding" # mailbox folder для чтения
        username_env: "ROP_MAILBOX_USERNAME" # имя env переменной с логином
        password_env: "ROP_MAILBOX_PASSWORD" # имя env переменной с паролем
