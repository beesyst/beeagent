app:
  name: "BeeAgent" # название приложения
  env: "dev" # окружение (dev/prod)

run:
  mode: "telegram" # режим запуска UI/transport

web:
  host: "127.0.0.1" # bind host for read-only operator web shell
  port: 8000 # bind port for read-only operator web shell
  open_browser: true # true/false - auto-open browser in web mode
  auth:
    enabled: true
    mode: beeui_session
    session_secret_env: BEEAGENT_WEB_SESSION_SECRET
    principals:
      - id: admin
        username: admin
        role: admin
        scopes: ["*"]
        token_env: BEEAGENT_WEB_ADMIN_TOKEN
      - id: rop
        username: rop
        role: viewer
        scopes: ["rop"]
        token_env: BEEAGENT_WEB_ROP_TOKEN
      - id: operator
        username: operator
        role: operator
        scopes: ["dashboard", "rop", "runs", "modules"]
        token_env: BEEAGENT_WEB_OPERATOR_TOKEN

telegram:
  enabled: false # true/false - включить/выключить интеграцию с Telegram
  bot_token_env: "TELEGRAM_BOT_TOKEN" # название переменной окружения, в которой хранится токен бота
  chat_id_env: "CHAT_ID" # название переменной окружения, в которой хранится ID чата для отправки сообщений
  telemetry_enabled: true # true/false - включить/выключить запись телеметрии апдейтов в storage/telemetry (jsonl)

logging:
  clear_logs: true # true/false - очищать ли логи при каждом запуске приложения
  utc: true # true/false - использовать ли UTC для отметок времени в логах
  level: "INFO" # уровень логирования (DEBUG/INFO/WARNING/ERROR/CRITICAL)

mock:
  seed: 42 # начальное значение для генератора случайных чисел (целое число)
  weeks: 4 # количество недель для генерации данных (целое число)
  stores: 3 # количество магазинов для генерации данных (целое число)
  skus: 12 # количество товаров для генерации данных (целое число)
  category: "Vitamins" # категория товаров для генерации данных (строка)

data:
  adapter: "mock" # адаптер для получения данных (mock/real)
  mock:
    dataset_id: null # идентификатор набора данных для генерации (строка или null)

scheduler:
  enabled: false # true/false
  interval: 100 # интервал в секундах между запусками scheduled-run (сек)
  start_run: true # true/false - запускать scheduled-run при старте приложения

approval:
  reject_reason: "Rejected by operator" # причина отклонения заявки

promo:
  stock_min: 10 # минимальный остаток для promo-кандидатов
  units_max: 2 # максимальные продажи за период

i18n:
  lang: "ru" # язык локализации
  path: "config/i18n/ru.yml" # путь к YAML с переводами

quiz:
  enabled: false # true/false - включить/выключить режим квиза
  path: "config/quiz/pharmacy_quiz.json" # путь к JSON с контентом квиза (относительно корня проекта)

modules:
  registry: # список объявленных локальных модулей
    - id: "beeagent-rop" # уникальный идентификатор модуля внутри registry
      package: "beeagent_rop" # Python import name пакета
      entry: "RopModule" # имя атрибута в __init__ пакета (класс или фабрика)
      enabled: true # true/false - включить/выключить загрузку модуля

rop:
  mailbox_poll:
    enabled: true
    source_id: "hotline_mailbox"
    sources_all: false
  email_preview:
    body_chars_max: 4000
  ai_assist:
    enabled: true
    events_max: 100
    request_timeout: 30
    ai_confidence_min: 0.70
    dry_run: false
    adjudicator:
      enabled: true
      timeout: 20
      input_chars_max: 8000
      confidence_accept_min: 0.70
      events_max: 100
      attachment_chars_max: 2000
      prompt_key: "rop.ai_adjudicator"
  routing:
    queues:
      sales:
        bitrix_category: sales
      tender:
        bitrix_category: tenders
      logistics:
        bitrix_category: logistics
      finance:
        bitrix_category: finance
      procurement:
        bitrix_category: procurement
      manual_review:
        bitrix_category: manual_review
  attachments: # настройки для извлечения вложений из событий ROP
    enabled: true # true/false - включить/выключить local document extraction вложений (не влияет на retention/download/Bitrix delivery)
    chars_max: 1000 # макс. число символов preview для извлечения из одного вложения
    size_max: 1048576 # макс. размер вложения в байтах для попытки извлечения (пример: 1 МБ = 1048576 байт)
    types:
      - "text/plain"
      - "text/csv"
      - "application/pdf"
      - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      - "image/jpeg"
      - "image/png"
    storage: # bounded opaque retention policy (independent from extraction)
      enabled: true # true/false - сохранять accepted attachment blobs как opaque files
      file_max: 10485760 # макс. размер одного сохраняемого вложения в байтах (10 МБ)
      message_max: 20971520 # макс. суммарный размер вложений одного письма в байтах (20 МБ)
      files_message_max: 20 # макс. число сохраняемых вложений на одно письмо
    extraction: # canonical local Docling extraction policy (replaces provider-based analysis)
      engine: "docling" # canonical local document engine (only supported engine v1); OCR backend is RapidOCR on onnxruntime
      chars_max: 3000 # макс. число символов bounded extracted text контекста из одного вложения
      pages_max: 20 # bounded page limit на один документ (docling max_num_pages)
      timeout_seconds: 60 # bounded local worker timeout на один документ (сек)
      ocr_enabled: true # true/false - использовать local RapidOCR
  sources:
    - source_id: "rop_batch_sample"
      source_type: "json_batch" # тип источника (поддерживается: json_batch)
      source_role: "batch_sample" # роль источника в бизнес-контексте клиента
      client_id: "welding" # идентификатор клиента/тенанта для источника
      display_name: "ROP Batch Sample" # человеко-читаемое имя источника для артефактов/UI
      enabled: false # true/false - использовать этот источник
      authority: "read_only" # уровень доступа (read_only/draft_only/execution_capable)
      items_max: 100 # максимальное число событий из источника
      batch:
        path: "storage/mock/rop_batch_sample.json" # путь к batch-файлу (относительно корня проекта)
        period: "2026-05" # период, который передаётся в rop_summary payload
    - source_id: "hotline_mailbox" # read-only mailbox source для live smoke
      source_type: "mailbox_readonly" # тип источника для чтения последних писем из mailbox
      source_role: "technical_aggregator" # роль источника в бизнес-контексте клиента
      client_id: "welding" # идентификатор клиента/тенанта для источника
      display_name: "Welding Hotline mailbox" # человеко-читаемое имя источника для артефактов/UI
      enabled: true # true/false - использовать этот источник
      authority: "read_only" # mailbox smoke не должен выполнять destructive actions
      items_max: 20 # максимальное число писем для одного smoke-run
      mailbox:
        host_env: "ROP_MAILBOX_HOST" # имя env переменной с IMAP host
        port: 993 # IMAP port
        use_ssl: true # использовать IMAP over SSL
        folder_env: "ROP_MAILBOX_FOLDER" # имя env переменной с mailbox folder
        username_env: "ROP_MAILBOX_USERNAME" # имя env переменной с логином
        password_env: "ROP_MAILBOX_PASSWORD" # имя env переменной с паролем
      routing:
        email_recipient: "hotline@welding.kz"
  dashboard:
    default_period: "7d"
    periods:
      - today
      - yesterday
      - 7d
      - 30d
      - 90d
      - 365d
      - all

bitrix:
  enabled: true # true/false - включить/выключить Bitrix connector
  webhook_env: "BITRIX_WEBHOOK_URL" # имя env переменной с полным HTTPS URL входящего Bitrix webhook
  timeout: 10 # таймаут HTTP-запроса к Bitrix REST API (сек)
  page_size: 50 # размер страницы для Bitrix list-запросов
  pages_max: 15 # максимальное число страниц пагинации (557 users on portal)
  types_entity: # типы сущностей Bitrix для поиска (1=lead,2=deal,3=contact,4=company)
    - 1
    - 2
    - 3
    - 4
  reconciliation:
    enabled: true # true/false - включить/выключить reconciliation по умолчанию
    candidate_limit: 20 # максимальное число кандидатов на одно событие
    window_date: 180 # окно поиска по дате события (дней назад)
    correlation:
      enabled: true # true/false - read-only проверка exact outbound email correlation (crm.activity.list, Message-ID bridge)
      window_days: 180 # окно поиска outbound email-активностей (дней назад)
  writeback:
    enabled: true # true/false - включить/выключить Bitrix write-back
    webhook_env: "BITRIX_WRITEBACK_WEBHOOK_URL" # имя env переменной с отдельным write credential (https URL)
    timeout: 10 # таймаут HTTP-запроса для write-back (сек)
    attempts_retry_max: 3 # максимум bounded попыток для retryable failures
    dry_run: false # true/false - планировать без реальных write-операций (zero writes)
    email_attach: true # true/false - прикреплять email-активность (crm.activity.add) к созданному или trusted exact thread CRM target
    email_completed: false # true/false - состояние COMPLETED создаваемой email-активности (false = письмо заметнее в таймлайне как незавершённое; true = завершённое)
    file_attach: true # true/false - отдельный switch физической доставки сохранённых attachment files в Bitrix email activity (crm.activity.update, FILES/fileData)
    source_id: "EMAIL" # Bitrix lead SOURCE_ID для создаваемых лидов (например EMAIL = "Входящее письмо"); пусто = не задавать
    user_id_fallback: 167 # Bitrix user ID назначается ответственным за новый лид, когда routing не нашёл активного пользователя (null = отключено); 167 = ROBOT WG (system@welding.kz, verified read-only)
    stages: # customer Lead stageId mapping (configurable, validated against Bitrix before POST when enabled)
      new_lead: "NEW" # Bitrix stageId for new_lead with fallback responsible (required when enabled)
      new_lead_assigned: "2" # Bitrix stageId for new_lead with exact matched responsible (required when enabled; verified read-only: STATUS_ID "2" = «Лид назначен»)
      irrelevant: "JUNK" # Bitrix stageId for irrelevant classification (required when enabled)
  widget:
    enabled: false
    token_env: BITRIX_ROP_WIDGET_TOKEN
    default_period: "7d"
    max_items: 50
  embedded_app:
    enabled: true
    portal_origin: "https://my.welding.kz"
    default_role: "viewer"
    request_timeout: 10

ai:
  prompts:
    path: "config/prompts.yml"
    store: false
  profiles:
    openai:
      enabled: true
      provider: openai_responses
      api_key_env: OPENAI_API_KEY
      base_url: "https://api.openai.com/v1"
      model: "gpt-5.4-nano"
    deepseek:
      enabled: false
      provider: openai_compatible
      api_key_env: DEEPSEEK_API_KEY
      base_url: "https://api.deepseek.com/v1"
      model: "deepseek-chat"
    lmstudio:
      enabled: false
      provider: openai_compatible
      api_key_env: LMSTUDIO_API_KEY
      base_url: "http://127.0.0.1:1234/v1"
      model: "local-model"
    custom:
      enabled: false
      provider: openai_compatible
      api_key_env: CUSTOM_AI_API_KEY
      base_url: ""
      model: ""
