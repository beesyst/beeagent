<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="/static/css/web.css">
</head>
<body class="layout-shell">
  <div class="page shell-page">
    <header class="navbar navbar-expand-md shell-navbar">
      <div class="container-xl">
        <a class="navbar-brand navbar-brand-autodark d-flex align-items-center gap-2" href="/">
          <span class="shell-mark">B</span>
          <span>
            <strong>BeeAgent</strong>
            <span class="text-secondary ms-1">Web Console</span>
          </span>
        </a>
        <div class="navbar-nav flex-row order-md-last">
          <div class="nav-item"><a class="nav-link" href="/api/runs">API</a></div>
        </div>
        <div class="collapse navbar-collapse show">
          <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/runs">Runs</a>
            <a class="nav-link" href="/modules">Modules</a>
          </div>
        </div>
      </div>
    </header>
    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl shell-container">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </div>
  <script src="/static/vendor/tabler/tabler.min.js"></script>
</body>
</html>
